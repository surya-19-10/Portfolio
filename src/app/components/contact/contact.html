<section class="contact-section section-container" id="contact">
  <div class="contact-card glass-card">
    <div class="contact-visual-glow"></div>
    
    <div class="contact-info">
      <h2>Let's connect</h2>
      <p>I am open to technical collaborations, speaking engagements, and full-stack software engineering opportunities.</p>
    </div>
    
    <div class="contact-actions">
      <!-- Copy Email Area -->
      <div class="email-copy-box" (click)="copyEmail()" id="contact-email-box" title="Click to copy email">
        <div class="email-details">
          <span class="email-label">Direct Email</span>
          <span class="email-address">{{ email }}</span>
        </div>
        <div class="copy-icon-box">
          <mat-icon>{{ copySuccess ? 'check_circle' : 'content_copy' }}</mat-icon>
        </div>
        <span class="tooltip" [ngClass]="{'visible': copySuccess}">Copied to Clipboard!</span>
      </div>

      <!-- External Links -->
      <div class="social-grid">
        <a [href]="githubUrl" target="_blank" rel="noopener noreferrer" class="social-card github" id="social-github-link">
          <mat-icon class="social-icon">terminal</mat-icon>
          <div class="social-info">
            <span class="social-name">GitHub</span>
            <span class="social-handle">&#64;surya-19-10</span>
          </div>
        </a>
        
        <a [href]="linkedinUrl" target="_blank" rel="noopener noreferrer" class="social-card linkedin" id="social-linkedin-link">
          <mat-icon class="social-icon">badge</mat-icon>
          <div class="social-info">
            <span class="social-name">LinkedIn</span>
            <span class="social-handle">surya-prakash-597148176</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
